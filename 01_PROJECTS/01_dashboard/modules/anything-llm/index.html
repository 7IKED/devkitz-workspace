<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>AnythingLLM (Understand Anything) | DkZ Dashboard</title>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: var(--bg, #060608); }
        .iframe-container { width: 100vw; height: 100vh; border: none; }
        .glass-header { position: absolute; top: 10px; left: 10px; z-index: 100; padding: 10px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(250,30,78,0.3); border-radius: 8px; color: #fff; font-family: 'Inter', sans-serif; display: flex; gap: 15px; align-items: center; }
        .glass-header a { color: var(--accent, #fa1e4e); text-decoration: none; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="glass-header">
        <a href="../../hub/index.html">← Hub</a>
        <span>AnythingLLM (Workspace & RAG)</span>
    </div>
    <!-- Port 3001 is default for AnythingLLM -->
    <iframe src="https://anything.dkz.app" class="iframe-container" allow="microphone; camera"></iframe>

    <!-- DkZ Shared Scripts -->
    <script src="../../shared/dkz-debug.js"></script>
    <script src="../../shared/dkz-navbar.js"></script>
    <script src="../../shared/dkz-eventlog.js"></script>
