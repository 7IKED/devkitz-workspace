version: '3.8'

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - ./data/anythingllm:/app/server/storage

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "4000:8080"
    volumes:
      - ./data/dashy/conf.yml:/app/public/conf.yml

  graphify:
    # Assuming Graphify has a Dockerfile or published image. If not, this is a placeholder.
    image: devkitz/graphify:latest
    container_name: graphify
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - ./data/graphify:/app/data

  gitnexus:
    # Assuming GitNexus has a Dockerfile or published image. If not, this is a placeholder.
    image: devkitz/gitnexus:latest
    container_name: gitnexus
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://gitnexus.dkz.app
    volumes:
      - ./data/gitnexus:/app/data

  openmanus:
    image: python:3.11-slim
    container_name: openmanus_qa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data/openmanus:/app
    command: >
      bash -c "pip install -r requirements.txt && python main.py 'Warte auf Webhooks vom Pi Agent'"

networks:
  default:
    name: devkitz_network
