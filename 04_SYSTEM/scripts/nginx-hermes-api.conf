server {
    listen 80;
    server_name api-hermes.devkitz.eu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name api-hermes.devkitz.eu;
    ssl_certificate /etc/letsencrypt/live/devkitz.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devkitz.eu/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}