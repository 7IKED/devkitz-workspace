version: "3"
services:
  dns-server:
    container_name: technitium-dns
    hostname: technitium-dns
    image: technitium/dns-server:latest
    ports:
      - "5380:5380/tcp" # DNS web console
      - "53:53/udp" # DNS service
      - "53:53/tcp" # DNS service
    environment:
      - DNS_SERVER_DOMAIN=technitium-dns # The primary domain name used by this DNS Server to identify itself
      - TZ=Europe/Berlin
    volumes:
      - ./config:/etc/dns
    restart: unless-stopped
